<html lang="es">
<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

<body>

  <nav class="navbar bg-body-tertiary">

      <a class="navbar-brand" href="index.html">Larpive</a>
      <div class="d-flex gap-2">
        <a id="nav-login" class="btn btn-primary" href="login.html" hidden>Login or Register</a>
        <a id="nav-profile" class="btn btn-outline-primary" href="user.html" hidden>Profile</a>

    <h1 class="mb-4">Search results for: <span id="search-title"></span></h1>

    <!-- Paginación: search.js rellena los enlaces y el texto de página.
        hidden va en el div exterior porque d-flex de dentro anularía el hidden si estuvieran juntos. -->

        <div class="d-flex justify-content-center align-items-center gap-3 my-4">
        <a id="prev-page" class="btn btn-outline-primary">Previous</a>
        <span id="page-info"></span>
        <a id="next-page" class="btn btn-outline-primary">Next</a>
        </div>
