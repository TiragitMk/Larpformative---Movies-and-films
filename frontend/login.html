<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>

  <nav class="navbar bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Larpive</a>
      <div class="d-flex gap-2">
        <a id="nav-login" class="btn btn-primary" href="login.html" hidden>Login or Register</a>
        <a id="nav-profile" class="btn btn-outline-primary" href="user.html" hidden>Profile</a>
        <button id="nav-logout" class="btn btn-outline-danger" type="button" hidden>Logoff</button>
      </div>
    </div>
  </nav>

<main class="container mt-4">
  <div class="row g-5">

    <!-- Login -->
    <div class="col-md-6">
      <h1>Log into an existing account</h1>
      <form id="login-form">
        <div class="form-floating mb-2">
          <input type="text" class="form-control" id="login-username" placeholder="Username" maxlength="30" required>
          <label for="login-username">Username</label>
        </div>
        <div class="form-floating mb-2">
          <input type="password" class="form-control" id="login-password" placeholder="Password" maxlength="128" required>
          <label for="login-password">Password</label>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <div id="login-error" class="text-danger mt-2"></div>
      </form>
    </div>

    <!-- Register. Las reglas de validación son las mismas que valida el backend. -->
    <div class="col-md-6">
      <h1>Register a new account</h1>
      <form id="register-form">
        <div class="form-floating mb-2">
          <input type="text" class="form-control" id="register-username" placeholder="Username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]+" required>
          <label for="register-username">Username (letters, numbers, _ . -)</label>
        </div>
        <div class="form-floating mb-2">
          <input type="password" class="form-control" id="register-password" placeholder="Password" minlength="8" maxlength="128" required>
          <label for="register-password">Password (min. 8 characters)</label>
        </div>
        <button type="submit" class="btn btn-success">Register</button>
        <div id="register-error" class="text-danger mt-2"></div>
      </form>
    </div>

  </div>
</main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
