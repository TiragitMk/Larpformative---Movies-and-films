<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>

  <nav class="navbar bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Larpive</a>
      <div class="d-flex gap-2">
        <a id="nav-login" class="btn btn-primary" href="login.html" hidden>Login or Register</a>
        <a id="nav-profile" class="btn btn-outline-primary" href="user.html" hidden>Profile</a>
        <button id="nav-logout" class="btn btn-outline-danger" type="button" hidden>Logoff</button>
      </div>
    </div>
  </nav>

<main class="container mt-4">

  <!-- Si el usuario no existe, user.js escribe aquí el error. -->
  <div id="user-error" class="text-danger"></div>

  <!-- Todo el contenido está oculto hasta que llegan los datos. -->
  <div id="user-content" hidden>

    <h1 id="user-name" class="mb-4"></h1>

    <!-- Calificaciones: una tarjeta por calificación. user.js las crea. -->
    <h4>Ratings (<span id="ratings-count">0</span>)</h4>
    <div id="ratings" class="row row-cols-1 row-cols-md-3 g-3"></div>
    <div id="ratings-pagination" hidden>
      <div class="d-flex justify-content-center align-items-center gap-3 my-3">
        <button id="ratings-prev" class="btn btn-outline-primary" type="button">Previous</button>
        <span id="ratings-page-info"></span>
        <button id="ratings-next" class="btn btn-outline-primary" type="button">Next</button>
      </div>
    </div>

    <!-- Comentarios: una tarjeta por comentario. user.js las crea. -->
    <h4 class="mt-5">Comments (<span id="comments-count">0</span>)</h4>
    <div id="comments" class="row row-cols-1 row-cols-md-2 g-3"></div>
    <div id="comments-pagination" hidden>
      <div class="d-flex justify-content-center align-items-center gap-3 my-3">
        <button id="comments-prev" class="btn btn-outline-primary" type="button">Previous</button>
        <span id="comments-page-info"></span>
        <button id="comments-next" class="btn btn-outline-primary" type="button">Next</button>
      </div>
    </div>

  </div>
</main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/user.js"></script>
</body>
</html>
