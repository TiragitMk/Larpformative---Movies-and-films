<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>

  <nav class="navbar bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Larpive</a>
      <div class="d-flex gap-2">
        <a id="nav-login" class="btn btn-primary" href="login.html" hidden>Login or Register</a>
        <a id="nav-profile" class="btn btn-outline-primary" href="user.html" hidden>Profile</a>
        <button id="nav-logout" class="btn btn-outline-danger" type="button" hidden>Logoff</button>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <!-- Si la película no existe, film.js escribe aquí el error. -->
    <div id="film-error" class="text-danger"></div>

    <!-- Todo el contenido está oculto hasta que llegan los datos. -->
    <div id="film-content" hidden>

      <!-- Título y subtítulo (año, director, duración) -->
      <h1 id="film-title"></h1>
      <h2 id="film-subtitle" class="text-body-secondary"></h2>

      <!-- Calificación, cada estrella lleva su valor en data-value. -->
      <div class="mb-4">
        <h2>Rate this film:</h2>
        <button type="button" class="star btn btn-link text-warning text-decoration-none fs-2 p-0" data-value="1">☆</button>
        <button type="button" class="star btn btn-link text-warning text-decoration-none fs-2 p-0" data-value="2">☆</button>
        <button type="button" class="star btn btn-link text-warning text-decoration-none fs-2 p-0" data-value="3">☆</button>
        <button type="button" class="star btn btn-link text-warning text-decoration-none fs-2 p-0" data-value="4">☆</button>
        <button type="button" class="star btn btn-link text-warning text-decoration-none fs-2 p-0" data-value="5">☆</button>
        <div id="rating-average" class="text-body-secondary"></div>
        <div id="rating-login" hidden><a href="login.html">Log in</a> to rate.</div>
        <div id="rating-error" class="text-danger"></div>
      </div>

      <!-- Póster y plot en dos columnas -->
      <div class="row mb-4">
        <div class="col-md-3">
          <img id="film-poster" class="img-fluid" alt="" hidden>
          <div id="no-poster" class="bg-secondary-subtle text-center py-5" hidden>No poster</div>
        </div>
        <div class="col-md-9">
          <p id="film-plot"></p>
        </div>
      </div>

      <!-- Detalles -->
      <div class="mb-4">
        <p><strong>Actors:</strong> <span id="film-actors"></span></p>
        <p><strong>Genre:</strong> <span id="film-genre"></span></p>
        <p><strong>Country:</strong> <span id="film-country"></span></p>
        <p><strong>Language:</strong> <span id="film-language"></span></p>
        <p><strong>Awards:</strong> <span id="film-awards"></span></p>
      </div>

      <!-- Nuevo comentario. Solo visible con sesión iniciada. -->
      <div class="mb-4">
        <h2>Comment on this film:</h2>
        <form id="comment-form" hidden>
          <div class="form-floating mb-2">
            <textarea class="form-control" id="comment-text" placeholder="Comment..." maxlength="400" required></textarea>
            <label for="comment-text">Comment...</label>
          </div>
          <button type="submit" class="btn btn-primary">Publish</button>
          <div id="comment-error" class="text-danger mt-2"></div>
        </form>
        <div id="comment-login" hidden><a href="login.html">Log in</a> to comment.</div>
      </div>

      <!-- Lista de comentarios, film.js la rellena. -->
      <h2>Comments (<span id="comment-count">0</span>)</h2>
      <div id="comments" class="list-group mb-3"></div>

      <!-- Paginación de comentarios -->
      <div id="comments-pagination" hidden>
        <div class="d-flex justify-content-center align-items-center gap-3 mb-5">
          <button id="comments-prev" class="btn btn-outline-primary" type="button">Previous</button>
          <span id="comments-page-info"></span>
          <button id="comments-next" class="btn btn-outline-primary" type="button">Next</button>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/film.js"></script>
</body>
</html>
